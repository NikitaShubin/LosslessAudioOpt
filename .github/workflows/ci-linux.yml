name: ci-linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Зависимости (ffmpeg, p7zip, wine 10 c i386)
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install -y --install-recommends winehq-stable ffmpeg p7zip-full
          wine --version

      - name: Инициализация wine prefix
        run: wineboot -u 2>/dev/null || true

      - name: Кэш кодеков (bin/)
        uses: actions/cache@v4
        with:
          path: bin
          key: codecs-linux-${{ hashFiles('formats/*.json') }}

      - name: Сборка linux-бинэрников
        run: make -j"$(nproc)" TARGET=linux all

      - name: Проверка конфигурации форматов
        run: ./llao-linux check-formats

      - name: Установка кодеков (нативный монолит)
        run: ./llao-linux tools

      - name: Юнит-тесты и ядро демона
        run: |
          make test-unit test-daemon-core test-stats-core test-enumerate test-tmp-isolation
          ./test-unit
          ./test-daemon-core
          ./test-stats-core
          ./test-enumerate
          ./test-tmp-isolation

      - name: Интеграционные тесты демона (restore/interactions/queue/persist)
        run: |
          make test-daemon-restore test-daemon-interactions test-daemon-queue test-daemon-persist test-daemon-pair \
            || { echo "=== daemon.log (последние 120 строк каждого префикса) ==="; \
                 for f in /tmp/llao-*-test-*/daemon.log /tmp/llao-restest-*/daemon.log /tmp/llao-int-*/daemon.log /tmp/llao-queue-*/daemon.log /tmp/llao-persist-*/daemon.log /tmp/llao-pair-*/daemon.log; do \
                   [ -f "$f" ] && { echo "--- $f ---"; tail -n 120 "$f"; }; \
                 done; exit 1; }

      - name: Тесты статистики (журнал и итоговая таблица)
        run: python3 tests/test_stats.py

      - name: Тесты выбора утилит (встроенный ffmpeg)
        run: python3 tests/test_media.py
