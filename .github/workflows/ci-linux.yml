name: ci-linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Зависимости (ffmpeg, p7zip, wine 10 c i386)
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install -y --install-recommends winehq-stable ffmpeg p7zip-full
          wine --version

      - name: Инициализация wine prefix
        run: wineboot -u 2>/dev/null || true

      - name: Кэш кодеков (bin/)
        uses: actions/cache@v4
        with:
          path: bin
          key: codecs-linux-${{ hashFiles('formats/*.json') }}

      - name: Сборка linux-бинэрников
        run: make -j"$(nproc)" TARGET=linux all

      - name: Проверка конфигурации форматов
        run: ./llao-linux check-formats

      - name: Предзагрузка Monkey's Audio (bin/monkeys_audio/x64.exe — сайт нестабилен)
        run: |
          mkdir -p bin/monkeys_audio
          curl -sL --retry 5 --retry-all-errors --retry-delay 15 --max-time 3600 \
            -o bin/monkeys_audio/x64.exe https://www.monkeysaudio.com/files/MAC_1325_x64.exe
          echo "4b93ec94c7229e3340be3259bbaa14a76185e8a33dad1394e708535bee476d1f  bin/monkeys_audio/x64.exe" | sha256sum -c -

      - name: Установка кодеков (нативный монолит)
        run: ./llao-linux tools

      - name: Юнит-тесты и ядро демона
        run: |
          make test-unit test-daemon-core
          ./test-unit
          ./test-daemon-core

      - name: Интеграционные тесты демона (restore/interactions/queue/persist)
        run: |
          make test-daemon-restore test-daemon-interactions test-daemon-queue test-daemon-persist \
            || { echo "=== daemon.log (последние 120 строк каждого префикса) ==="; \
                 for f in /tmp/llao-*-test-*/daemon.log /tmp/llao-restest-*/daemon.log /tmp/llao-int-*/daemon.log /tmp/llao-queue-*/daemon.log /tmp/llao-persist-*/daemon.log; do \
                   [ -f "$f" ] && { echo "--- $f ---"; tail -n 120 "$f"; }; \
                 done; exit 1; }