<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLAO daemon</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-box">
    <h1>LLAO daemon</h1>
    <p>Введите токен доступа (Bearer). Токен показан при запуске демона и хранится в discovery-файле.</p>
    <form id="login-form">
      <input id="token-input" type="password" placeholder="токен (64 hex)" autocomplete="off" spellcheck="false">
      <button type="submit">Войти</button>
    </form>
    <p id="login-error" class="error hidden"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <h1>LLAO daemon <span id="version"></span></h1>
    <div class="counters">
      <span>Всего: <b id="c-total">0</b></span>
      <span>Готово: <b id="c-done">0</b></span>
      <span>Ошибок: <b id="c-failed">0</b></span>
    </div>
    <div class="top-spacer"></div>
    <span id="conn-status" class="conn">Подключение...</span>
    <span id="last-seq" class="seq"></span>
    <div class="top-actions">
      <button id="btn-logout" title="Сменить токен">Выйти</button>
      <button id="btn-shutdown" class="icon-btn danger" title="Выключить демон">⏻</button>
    </div>
  </header>

  <section class="panel add-panel">
    <h2>Добавить</h2>
    <form id="add-form" class="row">
      <input id="add-path" type="text" placeholder="Путь на хосте демона, напр. Z:\music\album или /data/flac" spellcheck="false">
      <label class="chk"><input id="add-recursive" type="checkbox" checked> рекурсивно</label>
      <button type="submit">Добавить</button>
    </form>
    <p id="add-msg" class="msg"></p>
  </section>

  <section class="panel queue" id="queue-panel">
    <div class="queue-head">
      <button id="btn-sort" class="queue-title" title="Сортировать список по полному пути (регистрозависимо)">Очередь</button>
      <button id="btn-autoscroll" class="icon-btn" title="Следить за строками оптимизации">◎</button>
      <div class="queue-head__actions">
        <button id="btn-stop" class="icon-btn" title="Остановить активные файлы">⏹</button>
        <button id="btn-resume" class="icon-btn" title="Запустить остановленные файлы">▶</button>
        <button id="btn-clear-completed" class="icon-btn" title="Удалить только успешно завершённые (ok)">🧹</button>
        <button id="btn-expand" class="icon-btn" title="Развернуть на весь экран">⛶</button>
      </div>
    </div>
    <div class="table-wrap" id="table-wrap">
    <table id="queue-table">
      <thead><tr><th><input type="checkbox" id="chk-all" title="Выделить всё"></th><th></th><th>#</th><th>Файл</th><th class="th-center">Статус</th><th>Прогресс</th><th>Задачи</th><th class="action-head">
        <span class="action-btns">
          <button id="btn-batch-stop" class="icon-btn" title="Остановить выделенные">⏹</button>
          <button id="btn-batch-start" class="icon-btn" title="Запустить выделенные">▶</button>
          <button id="btn-batch-top" class="icon-btn" title="Переместить выделенные в начало">⇤</button>
          <button id="btn-batch-up" class="icon-btn" title="Переместить выделенные выше">↑</button>
          <button id="btn-batch-down" class="icon-btn" title="Переместить выделенные ниже">↓</button>
          <button id="btn-batch-bottom" class="icon-btn" title="Переместить выделенные в конец">⇥</button>
          <button id="btn-batch-delete" class="icon-btn danger" title="Удалить выделенные">🗑</button>
        </span>
      </th></tr></thead>
      <tbody id="queue-body"><tr><td colspan="8" class="empty">Очередь пуста</td></tr></tbody>
    </table>
    </div>
  </section>
</div>

<div id="op-msg" class="msg"></div>

<script src="/static/app.js"></script>
</body>
</html>
