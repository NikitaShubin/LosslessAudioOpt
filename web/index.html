<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLAO daemon</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-box">
    <h1>LLAO daemon</h1>
    <p>Введите токен доступа (Bearer). Токен показан при запуске демона и хранится в discovery-файле.</p>
    <form id="login-form">
      <input id="token-input" type="password" placeholder="токен (64 hex)" autocomplete="off" spellcheck="false">
      <button type="submit">Войти</button>
    </form>
    <p id="login-error" class="error hidden"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <h1>LLAO daemon <span id="version"></span></h1>
    <div class="counters">
      <span>Всего: <b id="c-total">0</b></span>
      <span>Готово: <b id="c-done">0</b></span>
      <span>Ошибок: <b id="c-failed">0</b></span>
    </div>
    <div class="top-actions">
      <button id="btn-logout" title="Сменить токен">Выйти</button>
    </div>
  </header>

  <section class="panel add-panel">
    <h2>Добавить</h2>
    <form id="add-form" class="row">
      <input id="add-path" type="text" placeholder="Путь на хосте демона, напр. Z:\music\album или /data/flac" spellcheck="false">
      <label class="chk"><input id="add-recursive" type="checkbox" checked> рекурсивно</label>
      <button type="submit">Добавить</button>
    </form>
    <p id="add-msg" class="msg"></p>
  </section>

  <section class="panel selection-bar hidden" id="sel-info">
    Выбрано: <b id="sel-count">0</b>
    <button id="btn-batch-stop" title="Остановить выделенные">⏹</button>
    <button id="btn-batch-start" title="Запустить выделенные заново">↻</button>
    <button id="btn-batch-delete" class="danger" title="Удалить выделенные">🗑</button>
  </section>

  <section class="panel queue" id="queue-panel">
    <div class="queue-head">
      <h2>Очередь</h2>
      <div class="queue-head__actions">
        <button id="btn-pause" title="Остановить очередь">⏸ Пауза</button>
        <button id="btn-clear-completed" title="Удалить все ok/skip/error">🧹 Очистить завершённые <span id="c-done-badge"></span></button>
        <button id="btn-expand" title="Развернуть на весь экран">⛶</button>
        <span class="muted" id="paused-badge"></span>
      </div>
    </div>
    <p id="op-msg" class="msg"></p>
    <div class="table-wrap">
    <table id="queue-table">
      <thead><tr><th><input type="checkbox" id="chk-all" title="Выделить всё"></th><th></th><th>#</th><th>Файл</th><th>Состояние</th><th>Прогресс</th><th>Задачи</th><th>Действия</th></tr></thead>
      <tbody id="queue-body"><tr><td colspan="8" class="empty">Очередь пуста</td></tr></tbody>
    </table>
    </div>
  </section>

  <section class="panel danger-zone">
    <h2>Демон</h2>
    <button id="btn-shutdown" class="danger" title="Выключить демон">⏻ Выключить демон</button>
  </section>

  <footer class="statusbar">
    <span id="conn-status" class="conn">Подключение...</span>
    <span id="last-seq" class="seq"></span>
  </footer>
</div>

<script src="/static/app.js"></script>
</body>
</html>
